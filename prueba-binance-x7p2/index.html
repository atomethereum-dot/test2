<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prueba Binance</title>
<style>
  :root{--bg:#07090f;--card:#0d1220;--rule:rgba(255,255,255,.12);--ink:#f3f5f9;--ink3:#8d95a8;--yel:#f0b90b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:460px;margin:0 auto;padding:24px 16px 40px}
  h1{margin:0 0 6px;font-size:20px}
  p{margin:0 0 14px;color:var(--ink3);font-size:13.5px}
  a{display:flex;align-items:center;gap:12px;margin:0 0 10px;padding:16px 14px;border:1px solid var(--rule);background:var(--card);color:var(--ink);text-decoration:none;font-size:16px}
  a b{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:8px;background:var(--yel);color:#111;font-size:17px}
  a small{display:block;color:var(--ink3);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Prueba Binance · ronda 2</h1>
  <p>Abre esta página en Chrome del Android (no dentro de Binance). Pulsa el botón 1; vuelve aquí y pulsa el 2, y así hasta el 12. Para cada uno apunta qué pasa: error, abre solo la wallet, o abre sectoraorg.com/staking dentro de Binance.</p>
  <div id="l"></div>
</main>
<script>
(function () {
  var U = "https://sectoraorg.com/staking/";
  var enc = encodeURIComponent;
  var b64 = function (s) { return btoa(s); };
  var b64url = function (s) { return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  /* la miniapp que SI abre en Android (panel de la wallet, la de @binance/w3w-utils) y la del navegador */
  var PANEL = "xoqXxUSMRccLCrZNRebmzj", NAVEGADOR = "yFK5FCqYprrXDiVFbhyRx7";
  var DASH = "L3BhZ2VzL2Rhc2hib2FyZC1uZXcvaW5kZXg=", BROWSER = b64("/pages/browser/index");
  var mp = function (app, path, q) { return "app.binance.com/mp/app?appId=" + app + "&startPagePath=" + path + (q ? "&startPageQuery=" + q : ""); };
  var intent = function (q) { return "intent://" + q + "#Intent;scheme=bnc;package=com.binance.dev;end"; };
  var V = [
    ["miniapp del panel + página del navegador (base64)", "bnc://" + mp(PANEL, BROWSER, b64("url=" + U + "&defaultChainId=1"))],
    ["miniapp del panel + página del navegador (base64 seguro)", "bnc://" + mp(PANEL, BROWSER, b64url("url=" + U + "&defaultChainId=1"))],
    ["miniapp del panel + url", "bnc://" + mp(PANEL, DASH, b64url("url=" + U))],
    ["miniapp del panel + url + isDeepLink", "bnc://" + mp(PANEL, DASH, b64url("url=" + enc(U) + "&isDeepLink=true"))],
    ["miniapp del panel + dappUrl", "bnc://" + mp(PANEL, DASH, b64url("dappUrl=" + enc(U) + "&isDeepLink=true"))],
    ["miniapp del panel + link", "bnc://" + mp(PANEL, DASH, b64url("link=" + enc(U) + "&isDeepLink=true"))],
    ["intent: miniapp del panel + página del navegador", intent(mp(PANEL, BROWSER, b64("url=" + U + "&defaultChainId=1")))],
    ["miniapp del navegador + isDeepLink (base64 seguro)", "bnc://" + mp(NAVEGADOR, BROWSER, b64url("url=" + U + "&defaultChainId=1&isDeepLink=true"))],
    ["web ?_dp: miniapp del navegador + isDeepLink", "https://app.binance.com/?_dp=" + b64url("/mp/app?appId=" + NAVEGADOR + "&startPagePath=" + BROWSER + "&startPageQuery=" + b64url("url=" + U + "&defaultChainId=1&isDeepLink=true"))],
    ["ruta cedefi/browser", "bnc://app.binance.com/cedefi/browser?url=" + enc(U)],
    ["ruta cedefi/dapp", "bnc://app.binance.com/cedefi/dapp?url=" + enc(U)],
    ["ruta web3/dapp", "bnc://app.binance.com/web3/dapp?url=" + enc(U)]
  ];
  var l = document.getElementById("l");
  V.forEach(function (v, i) {
    var a = document.createElement("a"); a.href = v[1]; a.rel = "noopener";
    var n = document.createElement("b"); n.textContent = String(i + 1); a.appendChild(n);
    var s = document.createElement("span"); s.textContent = "Probar " + (i + 1);
    var sm = document.createElement("small"); sm.textContent = v[0]; s.appendChild(sm); a.appendChild(s);
    l.appendChild(a);
  });
})();
</script>
</body>
</html>
