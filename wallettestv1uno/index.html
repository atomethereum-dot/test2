/* Layout: the wallet as a native-style app screen. Phone: full screen. Desktop: inside a flat phone frame. Pure black, Sectora blue. */
:root{--lime:#bcff2f;--bg:#000;--s1:#0c0e12;--s2:#15181e;--s3:#1d2128;--ln:rgba(255,255,255,.085);--tx:#f6f7fb;--mu:#8b93a6;--fa:#545c6e;--b:#1569ff;--b2:#5c9bff;--ok:#36d98a;--warn:#f0b54a;--bad:#ff6b5c;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
/* portada estilo exchange de primer nivel: barra superior, globo vivo, carrusel con indicador y botones blanco/oscuro */
.okx .sc{display:flex;flex-direction:column}
.otop{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.otop .brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16.5px;letter-spacing:-.015em}
.otop .brand small{display:block;font:500 10px/1 var(--mono);letter-spacing:.18em;color:var(--fa);text-transform:uppercase;margin-top:3px}
.otop .lang{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;background:var(--s1);border:1px solid var(--ln);font-size:13px;font-weight:500}
.okx .globe{width:min(100%,318px);margin:12px auto 0}
.car{overflow:hidden;margin-top:22px;touch-action:pan-y;cursor:grab}
.track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.cs{flex:0 0 100%;min-width:0;padding-right:10px}

.btn.white{background:#fff;color:#000}
.btn.dark{background:#16191f;color:#fff}
.legal{font-size:12px;color:var(--fa);text-align:center;padding-top:2px}

.intro .wm2{margin-top:26px;font-weight:300;font-size:25px;letter-spacing:.44em;padding-left:.44em;text-transform:uppercase;white-space:nowrap}
.intro .sub{margin-top:12px;font:500 10.5px/1 var(--mono);letter-spacing:.34em;padding-left:.34em;color:var(--mu);text-transform:uppercase}
/* v2: personal, seguridad visible y respuesta al toque */
.btn,.acts4 button,.op,.cb,.kp button,.tabs button,.rc,.secp{transition:transform .12s ease}
.btn:active,.acts4 button:active,.op:active,.cb:active,.kp button:active,.tabs button:active,.rc:active,.secp:active{transform:scale(.97)}
.fade.bk{animation-name:finb}

.me{display:flex;align-items:center;gap:12px;min-width:0}
.me small{display:block;font-size:12.5px;color:var(--mu)}
.me b{display:block;font-weight:500;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.avi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--b);font-weight:500;font-size:15px;letter-spacing:.02em;flex:none}
.avi.big{width:56px;height:56px;font-size:19px}
.mcard{position:relative;border-radius:26px;background:#1569ff;overflow:hidden;color:#fff;padding:20px 22px;height:216px}
.mcard .gp{position:absolute;right:-96px;top:-58px;width:330px;height:330px;pointer-events:none}
.mcard .r1{position:relative;display:flex;align-items:center;justify-content:space-between}
.mcard .wm{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;letter-spacing:.26em}
.mcard .sc2{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.28);font-size:12px;font-weight:500;color:var(--lime)}
.mcard .sc2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime)}
.mcard .nm{position:relative;margin-top:24px;font-size:32px;font-weight:400;letter-spacing:-.03em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .bl{position:relative;margin-top:8px;display:flex;align-items:baseline;gap:8px;font-size:13px;color:rgba(255,255,255,.75)}
.mcard .bl b{font-weight:400;color:#fff;font-size:15px}
.mcard .r3{position:absolute;left:22px;right:22px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 12.5px/1 var(--mono);color:rgba(255,255,255,.9);letter-spacing:.03em}
.mcard .r3 button{display:flex;align-items:center;gap:7px;color:inherit;white-space:nowrap}
.mcard .r3 span{white-space:nowrap}
.rcard .sc2{visibility:hidden}
.secp{width:100%;margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left}
.secp .shd{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--b);flex:none}
.secp .t{flex:1;min-width:0}
.secp b{display:block;font-weight:500;font-size:15px}
.secp small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px}
.segs i{height:4px;border-radius:2px;background:var(--s3)}.segs i.on{background:var(--b)}
.li .r b.na{color:var(--fa);font-weight:300}
.slist{margin-top:20px;padding:4px 16px}
.slist div{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--ln);font-size:14px;color:var(--mu)}
.slist div:first-child{border-top:0}
.slist div.ok{color:rgba(255,255,255,.9)}
.sk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--s3)}
.slist .ok .sk{background:var(--b);border-color:var(--b)}
.shero{margin-top:14px;padding:18px;display:flex;align-items:center;gap:18px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:400}
.shero .big{display:block;font-size:20px;font-weight:500;letter-spacing:-.02em}
.shero small{display:block;margin-top:6px;color:var(--mu);font-size:13px;line-height:1.45}
.qown{margin-top:14px;text-align:center;font-size:18px;font-weight:400;letter-spacing:-.01em}
.recent{display:flex;align-items:center;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.recent .lbl{flex:none}
.rc{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);font:500 12px/1 var(--mono);flex:none}
.checks{margin-top:12px;padding:4px 16px 8px}
.chh{display:flex;align-items:center;gap:9px;padding:12px 0 8px}
.chh b{font-weight:500;font-size:14.5px}
.chh span{margin-left:auto;font-size:12.5px;color:var(--mu)}
.ck{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:13.5px;color:rgba(255,255,255,.88)}
.ck svg{flex:none;margin-top:2px}
.ck.wn{color:var(--warn)}
.prof label.lbl{display:block;margin-bottom:4px}
.rename{width:100%;background:none;border:0;outline:none;font-size:19px;font-weight:400;padding:2px 0 4px;border-bottom:1px solid var(--ln)}
.rename:focus{border-color:var(--b)}
/* multired y swap */
.tki{border-radius:50%;display:grid;place-items:center;background:var(--s3);color:#fff;font-weight:500;letter-spacing:.02em;flex:none}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.nbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.npill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 13px;border-radius:18px;background:var(--s1);border:1px solid var(--ln);font-size:13.5px;font-weight:500}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:20}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#0f1116;border-top:1px solid var(--ln);border-radius:26px 26px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom,0px));animation:sup .25s ease both}
@keyframes sup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.bsheet .grab{width:40px;height:4px;border-radius:2px;background:#2c3242;margin:0 auto 14px}
.bsheet h3{margin:0 0 8px;font-size:17px;font-weight:500}
.nrow{width:100%;display:flex;align-items:center;gap:13px;padding:13px 6px;border-top:1px solid var(--ln);text-align:left}
.nrow>span:not(.tki):not(.bv){flex:1;min-width:0}
.nrow b{display:block;font-weight:500;font-size:15px}.nrow small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.nrow.on b{color:var(--b2)}
.nrow .ndot{width:12px;height:12px}
.nrow .bv{flex:none;font-variant-numeric:tabular-nums;color:var(--mu)}
.snote{margin:10px 6px 0;font-size:12.5px;color:var(--mu);line-height:1.5}
.sw{margin-top:10px;padding:12px 15px}
.swl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mu)}
.swl b{font-weight:500;color:var(--tx)}
.swr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.swv{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.swv.empty{color:var(--s3)}
.tokb{display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);font-weight:500;font-size:15px;flex:none}
.flipb{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--b);margin:-14px auto -14px;position:relative;z-index:2;box-shadow:0 0 0 5px #000}
.qd{margin-top:10px;padding:4px 16px}
.qd div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--ln);font-size:13px;color:var(--mu)}
.qd div:first-child{border-top:0}
.qd b{font-weight:500;color:var(--tx);text-align:right}
.qoff{display:flex;gap:10px;margin:0;padding:12px 0;font-size:13px;color:var(--mu);line-height:1.5}
.qoff svg{flex:none;margin-top:2px}
.slip{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 2px}
.kv a,.txl{color:var(--b2);text-decoration:none}.txl{display:block;font-size:12px;margin-top:2px}.kp.sm{margin-top:6px}.kp.sm button{height:42px;font-size:23px}
.swsum{margin-top:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.swsum small{display:block;color:var(--mu);font-size:12.5px}
.swsum b{display:block;font-size:26px;font-weight:300;letter-spacing:-.03em;margin:4px 0}
.swmid{display:grid;place-items:center;margin:8px 0 -6px}
.qcard .net .ndot{width:7px;height:7px}
[hidden]{display:none!important}
.stage{height:100%;display:grid;place-items:center;padding-block:18px}
.device{width:416px;height:min(872px,100%);border-radius:58px;border:3px solid #33363c;padding:10px;background:#000;position:relative}
.app{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--bg)}
@media (max-width:520px),(max-height:640px){.stage{padding:0;display:block}.device{width:100%;height:100%;border:0;padding:0;border-radius:0}.app{border-radius:0}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:16px}
.sc::-webkit-scrollbar{display:none}
.ft{display:grid;gap:10px;padding:10px 0 calc(24px + env(safe-area-inset-bottom,0px))}
.has-tabs .sc{padding-bottom:108px}
.mono{font-family:var(--mono)}
/* piezas comunes (mismo diseño que las capturas) */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px}
.nav{height:52px;display:flex;align-items:center;justify-content:space-between;flex:none}
.cb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--ln);flex:none;position:relative}
.nav .ttl{font-weight:500;font-size:17px}
.stp{display:flex;align-items:center;gap:10px;font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--mu)}
.stp .bar{display:flex;gap:4px}.stp .bar i{width:16px;height:3px;border-radius:2px;background:var(--s2)}.stp .bar i.on{background:var(--b)}
.kick{font:500 11px/1 var(--mono);letter-spacing:.24em;color:var(--b2);text-transform:uppercase}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--fa);text-transform:uppercase}
.h1{margin:28px 0 0;font-size:35px;font-weight:300;letter-spacing:-.03em;line-height:1.08}
.h1 em{font-style:normal;color:var(--b);font-weight:400}
.lead{margin:12px 0 0;color:var(--mu);font-size:15px;line-height:1.55}
.btn{height:58px;width:100%;border-radius:29px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:16.5px;color:#fff;background:var(--b)}
.btn.sec{background:var(--s1);border:1px solid var(--ln);color:var(--tx)}
.btn.wht{background:#fff;color:#000}
.btn:disabled{background:var(--s2);color:var(--fa);cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--s1);border:1px solid var(--ln);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--warn)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.note{display:flex;gap:12px;align-items:flex-start;color:var(--mu);font-size:13px;line-height:1.5}
.note svg{flex:none;margin-top:1px}
.warn{display:flex;gap:11px;margin-top:18px;padding:16px 4px 0;border-top:1px solid var(--ln);color:var(--mu);font-size:13px;line-height:1.5}
.warn svg{flex:none;margin-top:1px}
.prog{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--b);transition:width .2s}
/* bienvenida (globo que gira) */
.wel{display:grid;justify-items:center;text-align:center}
.globe{position:relative;width:min(100%,334px);aspect-ratio:1;margin-top:8px}
.globe canvas{position:absolute;inset:0;width:100%;height:100%}
.globe .lg{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:9%;box-shadow:0 0 0 9px #000}
.globe .lg svg{width:100%;height:100%;display:block}
button.lg{cursor:pointer;padding:0}
button.lg:hover{transform:translate(-50%,-50%) scale(1.04)}
.zoomer{position:absolute;z-index:40;pointer-events:none;border-radius:9%;box-shadow:0 0 0 9px #000;will-change:transform}
.zoomer svg{width:100%;height:100%;display:block}
.wel .kick{margin-top:22px}
.wel .h1{margin-top:16px;font-size:46px;font-weight:200}
.wel .h1 em{font-weight:400}
.wel .lead{max-width:310px}
.wel .addr{margin-top:10px;font:500 13px/1 var(--mono);color:var(--mu)}
.pwin{display:flex;align-items:center;gap:8px;height:58px;border-radius:29px;padding:0 8px 0 22px;background:var(--s1);border:1px solid var(--ln);width:100%;margin-top:22px}
.pwin:focus-within{border-color:var(--b)}
.pwin input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--mu);flex:none}
.link{margin-top:6px;font-size:13.5px;font-weight:500;color:var(--b2);text-align:center;width:100%;padding:10px 0}
/* reglas */
.rules{margin-top:26px}
.rule{width:100%;display:grid;grid-template-columns:52px 1fr 24px;gap:12px;align-items:start;padding:20px 0;border-top:1px solid var(--ln)}
.rule:last-child{border-bottom:1px solid var(--ln)}
.rule .n{font-size:28px;font-weight:200;letter-spacing:-.03em;color:var(--b);line-height:1}
.rule b{display:block;font-weight:500;font-size:16px}
.rule small{display:block;margin-top:6px;color:var(--mu);font-size:13.5px;line-height:1.5}
.tick{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--s3)}
.rule[aria-checked="true"] .tick{background:var(--b);border-color:var(--b)}
.rule[aria-checked="false"] .tick svg{opacity:0}
/* frase */
.vault{margin-top:24px;padding:6px;position:relative}
.vh{display:flex;align-items:center;justify-content:space-between;padding:12px}
.vh span{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.vh em{font-style:normal;font:500 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--b2)}
.wg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--ln);border-radius:16px;overflow:hidden;border:1px solid var(--ln)}
.w{height:60px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;background:#090b0e;min-width:0}
.w i{font:500 10px/1 var(--mono);font-style:normal;color:var(--b2)}
.w b{margin-top:7px;font-weight:500;font-size:16px;line-height:1;overflow:hidden;text-overflow:ellipsis}
.veil{position:absolute;left:6px;right:6px;top:52px;bottom:6px;border-radius:16px;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;background:rgba(9,11,14,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.veil .eye{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--b)}
.veil b{font-weight:500}.veil small{color:var(--mu);font-size:12.5px;max-width:230px}
.under{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 4px}
.under span,.under button{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mu)}
/* confirmar */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:26px}
.slot{height:72px;border-radius:18px;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;background:var(--s1);border:1px dashed var(--s3);min-width:0}
.slot.ok{background:var(--b);border:1px solid var(--b)}
.slot i{font:500 10.5px/1 var(--mono);font-style:normal;color:var(--mu)}.slot.ok i{color:rgba(255,255,255,.7)}
.slot b{font-weight:500;font-size:16.5px}
.q{margin-top:22px}
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.op{height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;background:var(--s1);border:1px solid var(--ln);color:rgba(255,255,255,.7);min-width:0}
.op.on{background:#fff;border-color:#fff;color:#000}
.op.bad{border-color:var(--bad);color:var(--bad)}
/* formularios */
.fld{margin-top:22px}
.fld label{display:block;font-size:13px;color:var(--mu);margin-bottom:9px}
.in{min-height:58px;border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px;background:var(--s1);border:1px solid var(--ln)}
.in:focus-within{border:1.5px solid var(--b)}
.in input,.in textarea{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;padding:14px 0}
.in textarea{resize:none;font:500 14.5px/1.55 var(--mono)}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
.meter i{height:4px;border-radius:2px;background:var(--s2)}
.mrow{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:var(--mu)}
.mrow b{color:var(--tx);font-weight:500}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:16px}
.reqs span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fa)}
.reqs span.on{color:rgba(255,255,255,.82)}
.reqs span svg{opacity:.3}.reqs span.on svg{opacity:1}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--ln)}
.row b{font-weight:500;font-size:15px;display:block}
.row small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.row .end{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--mu);font-size:14px}
.tg{width:51px;height:31px;border-radius:16px;position:relative;flex:none;background:var(--s3)}
.tg i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--b)}.tg.on i{left:22px}
.si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--s2)}
/* tarjeta Sectora */
.scard{position:relative;border-radius:26px;background:#1569ff;overflow:hidden;color:#fff;padding:20px 22px;height:212px}
.scard .gp{position:absolute;right:-96px;top:-58px;width:330px;height:330px;pointer-events:none}
.scard .r1{position:relative;display:flex;align-items:center;justify-content:space-between}
.scard .wm{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;letter-spacing:.26em}
.scard .net{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.18);font-size:12px;font-weight:500}
.scard .net i{width:6px;height:6px;border-radius:50%;background:#7dffb9}
.scard .lb{position:relative;margin-top:30px;font-size:13px;color:rgba(255,255,255,.75)}
.scard .v{position:relative;margin-top:6px;font-size:30px;font-weight:400;letter-spacing:-.035em;line-height:1.05}
.scard .r3{position:absolute;left:22px;right:22px;bottom:18px;display:flex;align-items:center;justify-content:space-between;font:500 13px/1 var(--mono);color:rgba(255,255,255,.88);letter-spacing:.04em}
.scard .r3 button{display:flex;align-items:center;gap:8px;color:inherit}
.rcard{position:relative;margin-top:12px}
.cbadge{position:absolute;right:-8px;top:-12px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 6px #000;z-index:2}
.feat{margin-top:24px}
.feat div{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--ln);font-size:14px;color:rgba(255,255,255,.86)}
.feat div:last-child{border-bottom:1px solid var(--ln)}
/* inicio */
.top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.acc{display:flex;align-items:center;gap:11px;min-width:0}
.acc b{display:flex;align-items:center;gap:5px;font-weight:500;font-size:16px}
.acc small{display:block;font:400 11.5px/1.2 var(--mono);color:var(--mu);margin-top:2px}
.ibs{display:flex;gap:10px}
.disp{margin-top:12px;padding:16px 18px 14px}
.disp .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bigbal{margin-top:14px;display:flex;align-items:baseline;gap:9px}
.bigbal b{font-size:54px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bigbal b.na{color:var(--fa);font-weight:300}
.bigbal em{font-style:normal;font-size:18px;font-weight:500;color:var(--mu)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--mu)}
.meta b{color:var(--warn);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.dc{margin-top:16px;padding-top:16px;border-top:1px solid var(--ln);position:relative}
.dc svg{display:block;width:100%;height:auto}
.dc .em{position:absolute;left:0;right:0;top:46px;text-align:center;font-size:12.5px;color:var(--mu)}
.tf2{display:flex;justify-content:space-between;margin-top:12px}
.tf2 button{font:500 11px/1 var(--mono);color:var(--fa);padding:7px 11px;border-radius:99px;letter-spacing:.06em}
.tf2 button.on{color:#000;background:#fff}
.acts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.acts4 button{height:80px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px 13px 12px;font-size:13px;font-weight:500;background:var(--s1);border:1px solid var(--ln)}
.acts4 button.pri{background:var(--b);border-color:var(--b)}
.lh{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:0 2px 4px;font-weight:500;font-size:15px}
.lh span{font-weight:500;font-size:13px;color:var(--b2)}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:13px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);overflow:hidden;flex:none}
.li b{font-weight:500;font-size:15.5px;display:block}
.li small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{text-align:right}
.li .r b{font-variant-numeric:tabular-nums}
.tabs{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:246px;margin-left:-123px;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;z-index:8;background:var(--s1);border:1px solid var(--ln)}
.tabs button{height:48px;min-width:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--fa);font-size:14px;font-weight:500;padding:0 12px}
.tabs button.on{color:#000;background:#fff;padding:0 18px}
/* recibir */
.qcard{margin-top:14px;border-radius:30px;background:#1569ff;padding:18px 18px 20px;color:#fff}
.qcard .r1{display:flex;align-items:center;justify-content:space-between}
.qcard .wm{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;letter-spacing:.26em}
.qcard .net{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.18);font-size:12px;font-weight:500}
.qcard .net i{width:6px;height:6px;border-radius:50%;background:#7dffb9}
.qp{margin:18px auto 0;width:min(100%,252px);padding:16px;border-radius:24px;background:#fff}
.qp svg{display:block;width:100%;height:auto}
.qcard .ad{margin-top:16px;text-align:center;font:500 14px/1.6 var(--mono);letter-spacing:.02em;overflow-wrap:anywhere}
.qcard .ad span{color:rgba(255,255,255,.55)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
/* enviar */
.to{margin-top:10px;min-height:68px;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px}
.to .tx{flex:1;min-width:0}
.to small{display:block;color:var(--mu);font-size:12px}
.to input{width:100%;background:none;border:0;outline:none;font:500 15px/1.3 var(--mono);margin-top:2px;padding:0}
.to .ok{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:12.5px;font-weight:500;flex:none}
.to .no{color:var(--bad)}
.amt{margin-top:26px;text-align:center}
.amt .v{font-size:84px;font-weight:300;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.amt .v.empty{color:var(--s3)}
.tokp{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 12px 7px 7px;border-radius:99px;font-weight:500;font-size:14px;background:var(--s1);border:1px solid var(--ln)}
.amt .av2{margin-top:12px;font-size:13px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);row-gap:2px;margin-top:12px}
.kp button{height:56px;display:grid;place-items:center;font-size:27px;font-weight:400;border-radius:16px}
.kp button:active{background:var(--s1)}
/* revisar */
.rvh{margin-top:22px;display:grid;justify-items:center;text-align:center}
.rvh small{font-size:13px;color:var(--mu)}
.rvh .big{margin-top:8px;display:flex;align-items:baseline;gap:8px}
.rvh .big b{font-size:62px;font-weight:300;letter-spacing:-.045em;line-height:1}
.rvh .big span{font-size:20px;color:var(--mu);font-weight:500}
.flow{margin-top:26px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:center}
.flow .p{display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.flow .p b{font-size:13.5px;font-weight:500}.flow .p small{font:400 11.5px/1 var(--mono);color:var(--mu)}
.flow .ar{display:grid;place-items:center;margin-top:-30px}
.kv{margin-top:12px;padding:2px 16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--ln);font-size:14px;color:var(--mu)}
.kv div:first-child{border-top:0}
.kv b{font-weight:500;color:var(--tx);text-align:right}
.kv .m{font:500 13.5px/1.4 var(--mono)}
.slide{position:relative;height:66px;border-radius:33px;background:var(--s1);border:1px solid var(--ln);touch-action:none;user-select:none;-webkit-user-select:none}
.slide .kn{position:absolute;left:5px;top:5px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--b);cursor:grab}
.slide .tx{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;font-size:15.5px;padding-left:40px;color:rgba(255,255,255,.9);pointer-events:none}
.slide .ch{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none}
.slide.done .kn{background:var(--ok)}
/* firmado */
.sg{position:relative;width:min(100%,290px);aspect-ratio:1;margin:6px auto 0}
.sg canvas{position:absolute;inset:0;width:100%;height:100%}
.sg .bdg{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;display:grid;place-items:center;background:var(--b);box-shadow:0 0 0 8px #000}
/* ajustes */
.prof{margin-top:16px;padding:16px;display:flex;align-items:center;gap:14px}
.mini{position:relative;width:76px;height:48px;border-radius:10px;background:#1569ff;overflow:hidden;flex:none}
.mini img{position:absolute;right:-30px;top:-22px;width:100px;height:100px}
.mini .lg{position:absolute;left:8px;top:8px}
.prof b{display:block;font-weight:500;font-size:17px}
.prof small{display:block;font:400 12px/1.3 var(--mono);color:var(--mu);margin-top:3px}
.prof .chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.prof .chip{padding:5px 9px;font-size:11.5px;background:var(--s2)}
.gl2{margin:22px 0 9px 4px}
.grp{padding:0 14px}
.grp .row:first-child{border-top:0}
.pill3{display:flex;gap:4px}
.pill3 button{padding:7px 10px;border-radius:99px;font:500 12px/1 var(--mono);color:var(--mu);border:1px solid var(--ln)}
.pill3 button.on{background:#fff;color:#000;border-color:#fff}
.toast{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;background:#fff;color:#000;font-weight:500;font-size:14px;z-index:50;white-space:nowrap}
.fade{animation:fin .28s ease both}
@keyframes fin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
</style>

  for (let la = -84; la <= 84; la += 2.1) { const n = Math.max(1, Math.round(360 * Math.cos(la * D) / 2.1)); for (let k = 0; k < n; k++) { const lo = -180 + k * 360 / n; if (POL.some(p => inP(lo, la, p))) LAND.push(vec(la, lo)); } }
  return LAND; }

/* patron blanco estatico de la tarjeta */

function cardPat() { if (CARDPAT) return CARDPAT; const s = 700, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d'), R = s * .48;
  for (const v of land()) { const r = rotv(v, -20, 20); if (r[2] < 0) continue; x.fillStyle = `rgba(255,255,255,${(.08 + .34 * r[2]).toFixed(3)})`; x.beginPath(); x.arc(s / 2 + r[0] * R, s / 2 - r[1] * R, s * .0042 * (.55 + .45 * r[2]), 0, 7); x.fill(); }
  return (CARDPAT = c.toDataURL('image/png')); }

/* globo vivo: gira, los nodos laten y por los arcos viaja un pulso */
const GLOBE = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, t0 = performance.now(); let raf = 0, list = [];
  function draw(cv, t) {
    const dpr = Math.min(2, devicePixelRatio || 1), Wc = cv.clientWidth; if (!Wc) return;
    if (cv.width !== Math.round(Wc * dpr)) cv.width = cv.height = Math.round(Wc * dpr);
    const x = cv.getContext('2d'), S2 = cv.width, R = S2 * .48, cx = S2 / 2, cy = S2 / 2, lon = -38 + t * 7, tilt = 17, nodes = NODES.map(([la, lo]) => vec(la, lo)), hub = vec(40.42, -3.7);
    x.clearRect(0, 0, S2, S2);
    x.strokeStyle = 'rgba(255,255,255,.14)'; x.lineWidth = S2 * .002; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.stroke();
    x.save(); x.beginPath(); x.arc(cx, cy, R * .995, 0, 7); x.clip();   // nada se dibuja fuera del globo
    for (const v of land()) { const r = rotv(v, lon, tilt); if (r[2] < 0) continue; x.fillStyle = `rgba(205,220,255,${(.16 + .74 * r[2]).toFixed(3)})`; x.beginPath(); x.arc(cx + r[0] * R, cy - r[1] * R, S2 * .0036 * (.55 + .45 * r[2]), 0, 7); x.fill(); }
    x.lineCap = 'round';
    nodes.forEach((b, i) => { if (i % 2) return; const a = hub, om = Math.acos(Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2])); if (om < .06) return;
      const pts = []; for (let s = 0; s <= 40; s++) { const u = s / 40, k1 = Math.sin((1 - u) * om) / Math.sin(om), k2 = Math.sin(u * om) / Math.sin(om), h = 1 + .05 * Math.sin(Math.PI * u) * om;
        pts.push(rotv([(a[0] * k1 + b[0] * k2) * h, (a[1] * k1 + b[1] * k2) * h, (a[2] * k1 + b[2] * k2) * h], lon, tilt)); }
      x.strokeStyle = 'rgba(21,105,255,.85)'; x.lineWidth = S2 * .0024; x.beginPath(); let on = false;
      for (const r of pts) { const px = cx + r[0] * R, py = cy - r[1] * R; if (r[2] > .02) { on ? x.lineTo(px, py) : x.moveTo(px, py); on = true; } else on = false; } x.stroke();
      const r = pts[Math.round(((t * .42 + i * .137) % 1) * 40)]; if (r[2] > 0) { x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + r[0] * R, cy - r[1] * R, S2 * .0055, 0, 7); x.fill(); } });
    nodes.forEach((v, i) => { const r = rotv(v, lon, tilt); if (r[2] < .06) return; const px = cx + r[0] * R, py = cy - r[1] * R, ph = (t * .7 + i * .31) % 1;
      x.strokeStyle = `rgba(92,155,255,${((1 - ph) * .8).toFixed(3)})`; x.lineWidth = S2 * .002; x.beginPath(); x.arc(px, py, S2 * (.01 + .03 * ph), 0, 7); x.stroke();
      x.fillStyle = '#000'; x.beginPath(); x.arc(px, py, S2 * .011, 0, 7); x.fill(); x.fillStyle = '#1569ff'; x.beginPath(); x.arc(px, py, S2 * .0078, 0, 7); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(px, py, S2 * .003, 0, 7); x.fill(); });
    x.restore();
  }
  function loop() { list = list.filter(c => c.isConnected); const t = (performance.now() - t0) / 1000; list.forEach(c => draw(c, t)); if (list.length && !reduce) raf = requestAnimationFrame(loop); }
  return { mount() { cancelAnimationFrame(raf); list = [...$app.querySelectorAll('canvas.gl')]; if (list.length) loop(); } };
})();

/* QR real con el logo al centro */
function qrSvg(text) {
  if (!window.SWQR) return '';
  const q = window.SWQR.create(text, { errorCorrectionLevel: 'H' }), N = q.modules.size, M = q.modules.data;
  const fin = (x, y) => x < 7 && y < 7 || x >= N - 7 && y < 7 || x < 7 && y >= N - 7, c0 = Math.floor(N / 2) - 3, c1 = c0 + 7; let d = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { if (!M[y * N + x] || fin(x, y) || (x >= c0 && x < c1 && y >= c0 && y < c1)) continue; d += `<circle cx="${x + .5}" cy="${y + .5}" r=".46"/>`; }
  const F = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" rx="1.8" fill="none" stroke="#05070d" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".8" fill="#1569ff"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="QR code of your address"><g fill="#05070d">${d}</g>${F(0, 0)}${F(N - 7, 0)}${F(0, N - 7)}
    <g transform="translate(${c0 + .6} ${c0 + .6}) scale(.058)"><rect width="100" height="100" rx="9" fill="#1569ff"/><circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="11"/></g></svg>`;
}
/* grafica de puntos vacia hasta que haya historial */
const DOTS = (n = 28, rows = 8, p = 11) => { let d = ''; for (let i = 0; i < n; i++) for (let y = 0; y < rows; y++) d += `<circle cx="${(i + .5) * p}" cy="${(y + .5) * p}" r="${(p * .3).toFixed(2)}" fill="#14171c"/>`;
  return `<svg viewBox="0 0 ${n * p} ${rows * p}" aria-hidden="true">${d}</svg>`; };

function strength(p) { let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++; if (/\d/.test(p) && /[^A-Za-z0-9]/.test(p)) s++; return s; }

function zoomTo(view, params = {}) {
  const lg = $app.querySelector('.globe .lg'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!lg || reduce || !Element.prototype.animate) return go(view, params);
  const a = $app.getBoundingClientRect(), r = lg.getBoundingClientRect(), z = document.createElement('div');
  z.className = 'zoomer'; z.innerHTML = LOGO(100);
  Object.assign(z.style, { left: (r.left - a.left) + 'px', top: (r.top - a.top) + 'px', width: r.width + 'px', height: r.height + 'px' });
  $app.appendChild(z); lg.style.visibility = 'hidden';
  const k = Math.hypot(a.width, a.height) / r.width * 2.6, dx = a.width / 2 - (r.left - a.left + r.width / 2), dy = a.height / 2 - (r.top - a.top + r.height / 2);
  $app.querySelector('.screen').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, fill: 'forwards' });
  z.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(1.25)`, offset: .28 }, { transform: `translate(${dx}px,${dy}px) scale(${k})` }],
    { duration: 820, easing: 'cubic-bezier(.6,0,.25,1)', fill: 'forwards' }).finished.then(() => {
      go(view, params); $app.appendChild(z);

}

function runIntro() {
  if (S.introDone || matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) { S.introDone = true; return; }
  S.introDone = true;
  const o = document.createElement('div'); o.className = 'intro'; o.setAttribute('aria-hidden', 'true');
  o.innerHTML = `<div class="box"><div class="il"><svg viewBox="0 0 100 100"><rect class="r" width="100" height="100" rx="9" fill="#1569ff"/><circle class="c" cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-width="11" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 50 50)"/></svg></div><div class="wm2">Sectora</div><div class="sub">Wallet</div></div>`;
  $app.appendChild(o);
  const il = o.querySelector('.il'), r = o.querySelector('.r'), c = o.querySelector('.c'), wm = o.querySelector('.wm2'), sub = o.querySelector('.sub'), tgt = $app.querySelector('.globe .lg');
  const parts = [...$app.querySelectorAll('.otop, .car, .pager, .ft, .wel > :not(.globe)')];
  if (tgt) tgt.style.visibility = 'hidden'; parts.forEach(p => p.style.opacity = 0);
  const E = 'cubic-bezier(.2,.8,.2,1)', A = [];
  A.push(il.animate([{ transform: 'scale(.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 520, easing: E, fill: 'both' }));
  A.push(c.animate([{ strokeDashoffset: 188.5 }, { strokeDashoffset: 0 }], { duration: 760, delay: 260, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'both' }));
  A.push(wm.animate([{ opacity: 0, letterSpacing: '.9em' }, { opacity: 1, letterSpacing: '.44em' }], { duration: 700, delay: 760, easing: E, fill: 'both' }));
  A.push(sub.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: 1100, easing: E, fill: 'both' }));
  let done = false;
  const finish = () => { if (done) return; done = true; o.remove(); if (tgt) tgt.style.visibility = ''; parts.forEach(p => p.style.opacity = ''); };
  const fly = () => {
    if (done) return;
    [wm, sub].forEach(e => e.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' }));
    const a = il.getBoundingClientRect(), b = tgt ? tgt.getBoundingClientRect() : a, k = b.width / a.width;
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    il.animate([{ transform: 'none' }, { transform: `translate(${dx}px,${dy}px) scale(${k})` }], { duration: 720, delay: 120, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'forwards' });
    o.animate([{ backgroundColor: 'rgba(0,0,0,1)' }, { backgroundColor: 'rgba(0,0,0,0)' }], { duration: 520, delay: 360, fill: 'forwards' });
    parts.forEach((p, i) => p.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: 520 + i * 70, easing: E, fill: 'backwards' }));
    setTimeout(() => { parts.forEach(p => p.style.opacity = ''); }, 520);
    setTimeout(finish, 900);

  o.addEventListener('click', () => { A.forEach(x => x.finish()); fly(); });
}

const toUnits = (v, d) => { try { return ethers.parseUnits(v || '0', d); } catch (e) { return 0n; } };
let qTimer = 0, qSeq = 0;

async function fetchQuote(seq) {
  const { n, from, to } = swapPair(), amt = toUnits(S.samt, from.d);
  if (amt <= 0n) { paintQuote('idle'); return; }
  try {
    let q;
    if (n.kind === 'sol') {
      const u = `https://lite-api.jup.ag/swap/v1/quote?inputMint=${from.mint}&outputMint=${to.mint}&amount=${amt}&slippageBps=${S.slip || 50}`;
      const j = await (await fetchT(u)).json(); if (!j.outAmount) throw new Error('no-route');
      q = { ok: true, router: 'Jupiter', raw: j, out: ethers.formatUnits(j.outAmount, to.d), min: ethers.formatUnits(j.otherAmountThreshold, to.d), impact: Number(j.priceImpactPct || 0) * 100, hops: (j.routePlan || []).map(r => r.swapInfo && r.swapInfo.label).filter(Boolean) };
    } else {
      const ti = from.native ? NATIVE_EVM : from.a, to2 = to.native ? NATIVE_EVM : to.a;
      const u = `https://aggregator-api.kyberswap.com/${n.kyber}/api/v1/routes?tokenIn=${ti}&tokenOut=${to2}&amountIn=${amt}`;
      const j = await (await fetchT(u, { headers: { 'x-client-id': 'sectora-wallet' } })).json(); const rs = j && j.data && j.data.routeSummary; if (!rs) throw new Error('no-route');
      const out = BigInt(rs.amountOut), min = out * BigInt(10000 - (S.slip || 50)) / 10000n;
      q = { ok: true, router: 'KyberSwap', raw: j.data, out: ethers.formatUnits(out, to.d), min: ethers.formatUnits(min, to.d), impact: null, gasUsd: rs.gasUsd, hops: [] };
    }
    if (seq !== qSeq) return; S.quote = q; paintQuote('ok');
  } catch (e) { if (seq !== qSeq) return; S.quote = { ok: false }; paintQuote('off'); }
}

      q('#pwerr').textContent = pw2.value && p !== pw2.value ? 'The passwords do not match.' : ''; };
    pw1.addEventListener('input', upd); pw2.addEventListener('input', upd);
    on('#pwGo', 'click', async () => { const btn = q('#pwGo'), pr = q('#eprog'); btn.disabled = true; pr.hidden = false;
      try { const json = await S.draft.encrypt(pw1.value, p => { pr.firstChild.style.width = (p * 100).toFixed(0) + '%'; btn.textContent = `Encrypting… ${(p * 100).toFixed(0)}%`; });
        store.set('vault', json); store.set('addr', S.draft.address); S.addr = S.draft.address;
        S.name = (q('#wname') && q('#wname').value.trim().slice(0, 24)) || 'Account 1'; store.set('name', S.name); S.since = Date.now(); store.set('since', S.since); S.backed = S.mode === 'import' ? 'imported' : 'confirmed'; store.set('backed', S.backed); adoptSol(S.draft); S.wallet = S.draft; S.draft = null; armLock(); go('ready');
      } catch (e) { btn.disabled = false; btn.textContent = 'Create wallet'; q('#pwerr').textContent = 'Could not encrypt the wallet on this device. Try again.'; } });
  }
  // desbloquear
  const doUnlock = async e => { if (e) e.preventDefault(); const pw = q('#upw').value, pr = q('#uprog'), btn = q('#uGo'), er = q('#uerr');
    if (!pw) return er.textContent = 'Enter your password.'; btn.disabled = true; pr.hidden = false; er.textContent = '';
    try { S.wallet = await ethers.Wallet.fromEncryptedJson(store.get('vault'), pw, p => { pr.firstChild.style.width = (p * 100).toFixed(0) + '%'; btn.textContent = `Unlocking… ${(p * 100).toFixed(0)}%`; });
      S.addr = S.wallet.address; adoptSol(S.wallet); armLock(); zoomTo('home');
    } catch (err) { btn.disabled = false; btn.textContent = 'Unlock'; pr.hidden = true; er.textContent = 'Wrong password. Try again.'; } };
  on('#unlockForm', 'submit', doUnlock); on('#uGo', 'click', doUnlock);
  // enviar
  const to = q('#to');
  if (to && false) { const chk = () => { S.to = to.value.trim(); const ok = ethers.isAddress(S.to);
      q('#valid').hidden = !ok; q('#toerr').textContent = S.to && !ok ? 'This is not a valid address.' : '';
      q('#idn').innerHTML = IDN(38, ok ? S.to : ''); q('#revGo').disabled = !(ok && +S.amt > 0); };
    to.addEventListener('input', chk); to.addEventListener('paste', () => setTimeout(chk, 0)); chk();
    on('#tokSwitch', 'click', () => { S.tok = S.tok === 'sect' ? 'eth' : 'sect'; S.to = to.value.trim(); render(); });
    qa('[data-k]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; let a = S.amt || '';
      if (k === 'del') a = a.slice(0, -1); else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; } else if (a.replace('.', '').length < 10) { const d = a.split('.')[1]; if (!(d && d.length >= 6)) a = (a === '0' ? '' : a) + k; }
      S.amt = a; const v = q('#amtv'); v.textContent = a || '0'; v.classList.toggle('empty', !a); chk(); }));
    on('#revGo', 'click', () => { S.to = ethers.getAddress(to.value.trim()); go('review'); });
  }
  // deslizar para firmar
  const sl = q('#slide'), kn = q('#knob');
  if (sl && S.view === 'review') { let x0 = null, dx = 0; const max = () => sl.clientWidth - 66;
    const setX = v => { dx = Math.max(0, Math.min(max(), v)); kn.style.transform = `translateX(${dx}px)`; sl.setAttribute('aria-valuenow', Math.round(dx / max() * 100)); };
    let busy = false;
    const finish = () => { if (busy) return; if (dx >= max() - 4) { busy = true; sl.classList.add('done'); const lab = sl.querySelector('.tx'); if (lab) lab.textContent = PREVIEW ? 'Signing…' : 'Sending…'; signNow(); } else { kn.style.transition = 'transform .2s'; setX(0); setTimeout(() => kn.style.transition = '', 220); } };
    kn.addEventListener('pointerdown', e => { x0 = e.clientX - dx; kn.setPointerCapture(e.pointerId); });
    kn.addEventListener('pointermove', e => { if (x0 !== null) setX(e.clientX - x0); });
    kn.addEventListener('pointerup', () => { x0 = null; finish(); });
    sl.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); setX(e.key === 'Enter' ? max() : dx + 50); if (dx >= max() - 4) finish(); } });
  }
  // ajustes y frase
  qa('[data-lockmin]').forEach(b => b.addEventListener('click', () => { S.lockMin = +b.dataset.lockmin; store.set('lock', S.lockMin); armLock(); render(); }));
  on('#wipe', 'click', () => { if (!S.wipeArm) { S.wipeArm = true; return render(); } ['vault', 'addr', 'txs', 'name', 'since', 'backed', 'sol', 'net'].forEach(store.del); S.wallet = null; S.addr = ''; S.wipeArm = false; go('welcome'); toast('Wallet deleted from this device'); });
  const doReveal = async e => { if (e) e.preventDefault(); const pw = q('#rpw').value, pr = q('#rprog'), er = q('#rerr'); pr.hidden = false; er.textContent = '';
    try { const w = await ethers.Wallet.fromEncryptedJson(store.get('vault'), pw, p => pr.firstChild.style.width = (p * 100).toFixed(0) + '%'); S.revealWords = w.mnemonic ? w.mnemonic.phrase.split(' ') : []; render(); }
    catch (err) { pr.hidden = true; er.textContent = 'Wrong password. Try again.'; } };
  on('#revForm', 'submit', doReveal); on('#revGo2', 'click', doReveal);
  on('#hideReveal', 'click', () => { S.revealWords = null; go('security'); });
  qa('[data-rec]').forEach(b => b.addEventListener('click', () => { const i = q('#to'); i.value = b.dataset.rec; i.dispatchEvent(new Event('input')); }));
  on('#rename', 'change', e => { const v = e.target.value.trim().slice(0, 24); if (v) { S.name = v; store.set('name', v); toast('Name saved'); render(); } });
}
async function signNow() {
  try { keepTx(await signSend()); setTimeout(() => go('sent'), 350); }
  catch (e) { console.warn('[wallet] send', e); go('send'); toast(errMsg(e, PREVIEW ? 'Could not sign. Check the amount.' : 'Could not send. Check the amount and your balance.'), 1); }
}
(function start() { if (window.ethers) return go('boot'); let n = 0; render(); const t = setInterval(() => { if (window.ethers || ++n > 60) { clearInterval(t); go('boot'); } }, 150); })();
})();
</script>
