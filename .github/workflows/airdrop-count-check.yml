name: Airdrop count check

# Solo lectura: ejecuta airdroptesting/count.js (el mismo calculo que la web) para una wallet
# con la apertura de prueba y muestra lo que veria el contador.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Wallet a revisar"
        required: true
  push:
    paths:
      - ".github/workflows/airdrop-count-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular
        env:
          ADDR: ${{ github.event.inputs.address || '0x659afdD493AcDf9EAA16a5221dcC522fA0A37704' }}
        run: |
          cat > run.cjs <<'JS'
          global.window = globalThis; window.SA_OPEN = Date.UTC(2026, 9, 27);
          require("./airdroptesting/count.js");
          const C = window.SACount, t0 = Date.now();
          console.log("OPEN", new Date(C.OPEN).toISOString(), "ahora", new Date().toISOString());
          C.wallet(process.env.ADDR).then(h => {
            console.log("historia en", Date.now() - t0, "ms · eventos staking:", h.ev.length, JSON.stringify(h.ev.map(e => [e.dep ? "dep" : "wd", e.amt, new Date(e.t).toISOString()])));
            console.log("nodo:", JSON.stringify(h.node && { at: new Date(h.node.at).toISOString(), active: h.node.active, spans: (h.node.spans || []).map(s => [new Date(s[0]).toISOString(), s[1] === Infinity ? "ahora" : new Date(s[1]).toISOString()]) }));
            const r = C.evaluate(h.ev, h.node, C.OPEN, Date.now());
            console.log("estado:", r.status, "· nivel", r.level, "· premio", r.prize, "· items", JSON.stringify(r.items.map(i => ({ desde: new Date(i.s).toISOString(), p: i.p }))));
            console.log("generado ahora:", C.liveEarned(r.items, r.closed, Date.now()).toFixed(6), "SECT");
          }).catch(e => { console.log("ERROR", e && e.message, "en", Date.now() - t0, "ms"); process.exit(1); });
          JS
          cat > probe.cjs <<'JS'
          const STAKING = "0x79Cb8B3B3e81a2B25C6d7250c3C5a742aa8320E0";
          const T = ["0x2da466a7b24304f47e87fa2e1e5a81b9831ce54fec19055ce277ca2f39ba42c4", "0x7084f5476618d8e60b11ef0d7d3f06914655adb8793e28ff7f018d4c76d505d5"];
          const pad = a => "0x" + a.toLowerCase().replace(/^0x/, "").padStart(64, "0");
          const URLS = ["https://ethereum-rpc.publicnode.com", "https://eth.drpc.org", "https://1rpc.io/eth", "https://eth.llamarpc.com", "https://rpc.ankr.com/eth", "https://cloudflare-eth.com", "https://eth-mainnet.public.blastapi.io", "https://ethereum.blockpi.network/v1/rpc/public", "https://rpc.flashbots.net", "https://eth.merkle.io"];
          (async () => {
            for (const u of URLS) {
              const post = async b => { try { const r = await fetch(u, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) }); const t = await r.text(); try { return JSON.parse(t); } catch (e) { return { error: "HTTP " + r.status + " " + t.slice(0, 100) }; } } catch (e) { return { error: String(e).slice(0, 100) }; } };
              const bn = await post({ jsonrpc: "2.0", id: 1, method: "eth_blockNumber", params: [] });
              const latest = bn.result ? parseInt(bn.result, 16) : 0;
              const out = [];
              for (const [back, span] of [[500, 500], [140000, 1000], [140000, 5000], [140000, 10000], [140000, 50000]]) {
                const q = await post({ jsonrpc: "2.0", id: 1, method: "eth_getLogs", params: [{ address: STAKING, fromBlock: "0x" + (latest - back).toString(16), toBlock: "0x" + (latest - back + span).toString(16), topics: [T] }] });
                out.push(back + "/" + span + ":" + (q.result ? "ok(" + q.result.length + ")" : String(JSON.stringify(q.error || q)).slice(0, 90)));
              }
              console.log(u, "| bloque", latest, "|", out.join(" | "));
            }
          })();
          JS
          node probe.cjs || true
          node run.cjs
