name: Precios para video (temporal, solo lectura)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: Serie de 7 dias de Solana en CoinGecko
        run: |
          for i in 1 2 3 4; do
            r=$(curl -s "https://api.coingecko.com/api/v3/coins/solana/market_chart?vs_currency=usd&days=7&interval=daily")
            echo "$r" | grep -q '"prices"' && { echo "SOL7D $r"; break; }
            echo "intento $i: $r"; sleep 20
          done
