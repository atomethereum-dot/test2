name: Precios para video (temporal, solo lectura)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: Leer precios de CoinGecko
        run: |
          echo "=== SIMPLE ==="
          curl -s "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true"
          echo
          echo "=== SECT ==="
          curl -s "https://api.coingecko.com/api/v3/simple/token_price/ethereum?contract_addresses=0x8c9984b06281f1ca9416e493c2e602aab08513db&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true"
          echo
          echo "=== 7D ==="
          for id in bitcoin ethereum binancecoin solana; do sleep 8; echo "$id"; curl -s "https://api.coingecko.com/api/v3/coins/$id/market_chart?vs_currency=usd&days=7&interval=daily" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([[p[0], round(p[1], 4)] for p in d.get('prices', [])]) if 'prices' in d else d)"; done
