name: Nodos activados

# Guarda en nodos/activaciones.json los nodos que se activaron en el Dashboard (avisos en ntfy.sh, que los
# guarda 12 horas). El conteo del airdrop y el panel leen ese archivo (y los avisos recientes de ntfy).
# El horario de GitHub se retrasa mucho, asi que cada vuelta se queda vigilando unas 5 h 40 min (cada
# 5 minutos) y al terminar lanza la siguiente. El horario queda de respaldo por si la cadena se corta.
# Con "prueba" se comprueba el circuito con un tema aparte y sin guardar nada.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Probar con un aviso de prueba (no guarda nada)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: nodos-activados
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Prueba del circuito (tema aparte, sin guardar)
        if: ${{ inputs.prueba }}
        run: |
          T="sectora-hn-1ux29d4rgvyv5l-prueba"
          curl -sS -d '{"w":"0x00000000000000000000000000000000000000aa","n":"Nodo de prueba","c":"Mérida, VE","la":8.59,"lo":-71.16}' "https://ntfy.sh/$T" >/dev/null
          curl -sS -d '{"w":"no-es-wallet","n":"x","la":1,"lo":1}' "https://ntfy.sh/$T" >/dev/null
          sleep 2
          cp nodos/activaciones.json /tmp/prueba.json
          node .github/scripts/nodos-sync.mjs "$T" /tmp/prueba.json
          cat /tmp/prueba.json

      - name: Recoger y guardar los avisos (cada 5 minutos)
        if: ${{ !inputs.prueba }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REF="${{ github.ref_name }}"
          for n in $(seq 1 68); do
            node .github/scripts/nodos-sync.mjs || echo "ntfy no respondio, se reintenta en 5 minutos"
            if ! git diff --quiet -- nodos/activaciones.json; then
              git add nodos/activaciones.json
              git commit -q -m "Nodos activados: sincronización"
              for i in 1 2 3 4; do
                git pull -q --rebase origin "$REF" && git push -q origin "HEAD:$REF" && break
                sleep $((i * 5))
              done
            fi
            if [ "$n" -lt 68 ]; then sleep 300; fi
          done

      - name: Lanzar la siguiente vuelta
        if: ${{ always() && !inputs.prueba }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nodos-activados.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || echo "no se pudo lanzar; el horario hara de respaldo"
