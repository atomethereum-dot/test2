name: My Airdrop check

# Solo lectura: abre sectoraorg.com/myairdrop con una direccion en un navegador y escribe en el log
# lo que muestra la pagina (premio, staking, nodo, testnet, historial). Solo se lanza a mano y no falla.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Wallet a revisar"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abrir la pagina
        env:
          ADDR: ${{ github.event.inputs.address }}
        run: |
          npm i --silent playwright@1.48.2 >/dev/null 2>&1 || true
          npx --yes playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1 || true
          cat > look.cjs <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1280, height: 900 }, locale: "es-ES" });
            p.on("pageerror", e => console.log("ERROR de pagina:", e.message));
            await p.goto("https://sectoraorg.com/myairdrop/?a=" + process.env.ADDR + "&nc=" + Date.now());
            await p.waitForSelector(".hero", { timeout: 60000 });
            await p.waitForTimeout(3000);
            console.log((await p.innerText("#app")).replace(/\n{2,}/g, "\n"));
            // conectar desde Safari del iPhone (sin wallet inyectada): la lista de apps y el enlace de WalletConnect
            const m = await (await b.newContext({ ...require("playwright").devices["iPhone 13"], locale: "es-ES" })).newPage();
            await m.goto("https://sectoraorg.com/myairdrop/?nc=" + Date.now());
            await m.click('[data-a="connect"]');
            await m.waitForSelector('.maw-r[data-app="metamask"][href^="metamask://wc?uri="]', { timeout: 45000 })
              .then(async () => console.log("MOVIL: enlace de WalletConnect listo ·", (await m.getAttribute('.maw-r[data-app="metamask"]', "href")).slice(0, 40) + "…"))
              .catch(async () => console.log("MOVIL: sin enlace de WalletConnect ·", await m.innerText(".maw-st").catch(() => "")));
            console.log("MOVIL: apps ·", (await m.$$eval(".maw-r .maw-n", l => l.map(x => x.textContent))).join(", "));
            await b.close();
          })().catch(e => console.log("NO SE PUDO:", e.message));
          JS
          node look.cjs || true
