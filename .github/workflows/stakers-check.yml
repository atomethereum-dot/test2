name: Stakers check

# Solo lectura: lista las wallets con SECT en staking (el mismo calculo que la web, airdrop/count.js)
# y mira cuales son contratos (Safe u otra wallet de contrato) en vez de wallets normales.
# No envia nada ni toca ningun contrato. Las direcciones salen acortadas.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar stakers
        run: |
          cat > run.cjs <<'JS'
          global.window = globalThis;
          require("./airdrop/count.js");
          const C = window.SACount;
          const RPCS = ["https://ethereum-rpc.publicnode.com", "https://eth.drpc.org", "https://1rpc.io/eth"];
          async function rpc(method, params) {
            for (const u of RPCS) {
              try {
                const r = await fetch(u, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
                const j = await r.json(); if (j && j.result !== undefined) return j.result;
              } catch (e) {}
            }
            return null;
          }
          const corta = w => w.slice(0, 6) + "…" + w.slice(-4);
          (async () => {
            const todos = await C.everyone();
            const stakers = todos.map(x => ({ who: x.who, bal: x.ev.reduce((a, e) => a + (e.dep ? e.amt : -e.amt), 0), n: x.ev.length }))
              .filter(x => x.n > 0);
            console.log("Wallets que alguna vez hicieron staking:", stakers.length, "· con saldo ahora:", stakers.filter(x => x.bal > 0.0001).length);
            const tipos = { normal: [], delegada7702: [], safe: [], contrato: [], error: [] };
            for (const s of stakers) {
              const code = await rpc("eth_getCode", [s.who, "latest"]);
              let tipo;
              if (code === null) tipo = "error";
              else if (code === "0x") tipo = "normal";
              else if (/^0xef0100/i.test(code)) tipo = "delegada7702";
              else {
                // Safe: responde a getThreshold() y getOwners()
                const th = await rpc("eth_call", [{ to: s.who, data: "0xe75235b8" }, "latest"]);
                const ow = await rpc("eth_call", [{ to: s.who, data: "0xa0e67e2b" }, "latest"]);
                tipo = th && th.length >= 66 && ow && ow.length > 130 ? "safe" : "contrato";
              }
              tipos[tipo].push(s);
            }
            const linea = (k, txt) => console.log(txt + ":", tipos[k].length, tipos[k].length ? "→ " + tipos[k].map(s => corta(s.who) + " (" + s.bal.toFixed(2) + " SECT)").join(", ") : "");
            linea("normal", "Wallets normales (MetaMask, Trust, Tangem, Ledger…)");
            linea("delegada7702", "Wallets normales con cuenta inteligente (EIP-7702)");
            linea("safe", "SAFE (multifirma)");
            linea("contrato", "Otros contratos");
            linea("error", "No se pudo comprobar");
            // cuentas inteligentes (EIP-7702): a que contrato delega cada una (MetaMask, Uniswap, otra wallet...)
            const dest = {};
            for (const s of tipos.delegada7702) {
              const code = await rpc("eth_getCode", [s.who, "latest"]);
              const d = "0x" + String(code).slice(8, 48).toLowerCase();
              (dest[d] = dest[d] || []).push(corta(s.who));
            }
            Object.keys(dest).forEach(d => console.log("Delegan en", d, ":", dest[d].length, "→", dest[d].join(", ")));
            // Titanes (4.000 SECT o mas): como les llegaron sus SECT (que sistema hizo la compra o quien los envio)
            const SECT = "0x8C9984B06281f1CA9416e493c2E602AaB08513db";
            const T_TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
            const CONOCIDOS = {
              "0x3fc91a3afd70395cd496c647d5a6cc9d4b2b7fad": "Uniswap (Universal Router)",
              "0x66a9893cc07d91d95644aedd05d03f95e1dba8af": "Uniswap (Universal Router v4)",
              "0x68b3465833fb72a70ecdf485e0e4c7bd8665fc45": "Uniswap (SwapRouter02)",
              "0xe592427a0aece92de3edee1f18e0157c05861564": "Uniswap (SwapRouter v3)",
              "0x881d40237659c251811cec9c364ef91dc08d300c": "MetaMask Swaps",
              "0x111111125421ca6dc452d289314280a0f8842a65": "1inch (v6)",
              "0x1111111254eeb25477b68fb85ed929f73a960582": "1inch (v5)",
              "0xdef1c0ded9bec7f1a1670819833240f027b25eff": "0x (Exchange Proxy)",
              "0x9008d19f58aabd9ed0d60971565aa8510560ab41": "CoW Swap",
              "0x79cb8b3b3e81a2b25c6d7250c3c5a742aa8320e0": "staking de Sectora (SECT devueltos del staking)",
              "0x000000000004444c5dc75cb358380d2e3de08a90": "Uniswap v4 (PoolManager)"
            };
            const SWAPS = {
              "0xd78ad95fa46c994b6551d0da85fc275fe613ce37657fb8d5e3d130840159d822": "Uniswap v2",
              "0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67": "Uniswap v3",
              "0x40e9cecb9f5f1f1c5b9c97dec2917b7ee92e57ba5563708daca94dd84ad7112f": "Uniswap v4"
            };
            // nombre publico de una direccion (contrato verificado o etiqueta de exchange), sin claves
            const ETIQ = {};
            async function etiqueta(a) {
              a = String(a).toLowerCase();
              if (a in ETIQ) return ETIQ[a];
              let n = CONOCIDOS[a] || "";
              if (!n) {
                try {
                  const j = await (await fetch("https://eth.blockscout.com/api/v2/addresses/" + a, { headers: { accept: "application/json" } })).json();
                  const tags = ((j.metadata && j.metadata.tags) || []).map(t => t.name)
                    .concat((j.public_tags || []).map(t => t.display_name || t.label))
                    .concat((j.implementations || []).map(i => i.name));
                  n = [j.name].concat(tags).filter(Boolean).filter((v, i, s) => s.indexOf(v) === i).join(" / ");
                  if (!n && j.is_contract === false) n = "wallet normal";
                  if (!n && j.is_contract) n = "contrato sin verificar";
                } catch (e) {}
              }
              if (!n || n === "contrato sin verificar") {
                try {
                  const r = await fetch("https://sourcify.dev/server/v2/contract/1/" + a + "?fields=compilation");
                  if (r.ok) { const j = await r.json(); if (j.compilation && j.compilation.name) n = j.compilation.name + " (Sourcify)"; }
                } catch (e) {}
              }
              return ETIQ[a] = n || "sin nombre publico";
            }
            const esStaker = new Set(stakers.map(s => s.who.toLowerCase()));
            const hex = n => "0x" + n.toString(16);
            // los mismos nodos que usa la web para leer eventos antiguos (airdrop/count.js)
            const LOGS = ["https://gateway.tenderly.co/public/mainnet", "https://rpc.mevblocker.io", "https://ethereum-rpc.publicnode.com"];
            async function logsDe(params) {
              for (const u of LOGS) {
                try {
                  const r = await fetch(u, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_getLogs", params }) });
                  const j = await r.json(); if (j && Array.isArray(j.result)) return j.result;
                } catch (e) {}
              }
              return null;
            }
            const ultimo = parseInt(await rpc("eth_blockNumber", []), 16);
            const desde = ultimo - 7200 * 240;   // ultimos ~240 dias
            const titanes = stakers.filter(x => x.bal >= 4000).sort((a, b) => b.bal - a.bal);
            for (const t of titanes) {
              const pad = "0x" + "0".repeat(24) + t.who.slice(2).toLowerCase();
              const txs = new Set();
              let fallos = 0, step = 50000;
              for (let a0 = desde; a0 <= ultimo;) {
                const b0 = Math.min(ultimo, a0 + step - 1);
                const l = await logsDe([{ address: SECT, fromBlock: hex(a0), toBlock: hex(b0), topics: [T_TRANSFER, null, pad] }]);
                if (l === null) { if (step > 1000) { step = Math.floor(step / 2); continue; } fallos++; a0 = b0 + 1; continue; }
                l.forEach(x => txs.add(x.transactionHash)); a0 = b0 + 1;
              }
              if (fallos) console.log("  (aviso: " + fallos + " tramos no se pudieron leer)");
              const vias = {};
              const yo = t.who.toLowerCase();
              for (const h of txs) {
                const tx = await rpc("eth_getTransactionByHash", [h]);
                if (!tx) continue;
                const to = String(tx.to || "").toLowerCase(), from = String(tx.from || "").toLowerCase();
                // de donde salieron los SECT dentro de la transaccion y si hubo un swap
                const rc = await rpc("eth_getTransactionReceipt", [h]);
                const logs = (rc && rc.logs) || [];
                const origen = logs.filter(x => String(x.address).toLowerCase() === SECT.toLowerCase() && x.topics[0] === T_TRANSFER && String(x.topics[2]).toLowerCase() === pad)
                  .map(x => "0x" + String(x.topics[1]).slice(26).toLowerCase());
                const swap = [...new Set(logs.map(x => SWAPS[x.topics && x.topics[0]]).filter(Boolean))].join("+");
                let via;
                if (from !== yo) via = "se los envio " + corta(from) + " [" + await etiqueta(from) + (esStaker.has(from) ? ", tambien hizo staking" : "") + "]" + (to !== SECT.toLowerCase() ? " usando " + await etiqueta(to) : "");
                else if (to === "0x79cb8b3b3e81a2b25c6d7250c3c5a742aa8320e0") via = "SECT devueltos del staking de Sectora (no es compra)";
                else if (to === yo) via = "operacion agrupada desde su propia cuenta inteligente";
                else via = "firmo con " + await etiqueta(to) + " (" + corta(to) + ")";
                if (swap) via += " · swap en " + swap;
                if (from === yo && origen.length && to !== "0x79cb8b3b3e81a2b25c6d7250c3c5a742aa8320e0") via += " · SECT salieron de " + await etiqueta(origen[0]);
                vias[via] = (vias[via] || 0) + 1;
              }
              console.log("TITAN", corta(t.who), "(" + t.bal.toFixed(2) + " SECT):", Object.keys(vias).length ? Object.entries(vias).map(([k, v]) => k + " ×" + v).join(" | ") : "sin entradas de SECT en los ultimos 240 dias");
            }
            // Todos los que tienen SECT en la wallet (no solo staking): que tipo de wallet es cada uno
            const dec = parseInt(await rpc("eth_call", [{ to: SECT, data: "0x313ce567" }, "latest"]), 16) || 18;
            const saldo = {};
            let next = "", paginas = 0;
            for (; paginas < 300; paginas++) {
              let j;
              try { j = await (await fetch("https://eth.blockscout.com/api/v2/tokens/" + SECT + "/holders" + next, { headers: { accept: "application/json" } })).json(); } catch (e) { break; }
              (j.items || []).forEach(x => { saldo[String(x.address.hash).toLowerCase()] = Number(x.value) / 10 ** dec; });
              if (!j.next_page_params) break;
              next = "?" + new URLSearchParams(j.next_page_params).toString();
            }
            if (!Object.keys(saldo).length) {
              // sin Blockscout: saldos sumando todas las transferencias de SECT de los ultimos ~2 años
              console.log("(Blockscout no respondio: calculo los saldos con los eventos)");
              const ini = ultimo - 7200 * 730;
              let step = 50000;
              for (let a0 = ini; a0 <= ultimo;) {
                const b0 = Math.min(ultimo, a0 + step - 1);
                const l = await logsDe([{ address: SECT, fromBlock: hex(a0), toBlock: hex(b0), topics: [T_TRANSFER] }]);
                if (l === null) { if (step > 1000) { step = Math.floor(step / 2); continue; } a0 = b0 + 1; continue; }
                l.forEach(x => {
                  const de = "0x" + x.topics[1].slice(26), a = "0x" + x.topics[2].slice(26), v = Number(BigInt(x.data && x.data !== "0x" ? x.data : 0)) / 10 ** dec;
                  saldo[de] = (saldo[de] || 0) - v; saldo[a] = (saldo[a] || 0) + v;
                });
                a0 = b0 + 1;
              }
            }
            const conSaldo = Object.entries(saldo).filter(([w, b]) => b > 0.0001 && w !== "0x0000000000000000000000000000000000000000");
            const DELEG = {
              "0x000000005c84f8fd50b21cac312528a64437030e": "Uniswap Wallet",
              "0x63c0c19a282a1b52b07dd5a65b58948a07dae32b": "MetaMask",
              "0x80296ff8d1ed46f8e3c7992664d13b833504c2bb": "OKX Wallet",
              "0x69007702764179f14f51cdce752f4f775d74e139": "Alchemy"
            };
            const grupos = {};
            for (const [w, b] of conSaldo) {
              const code = await rpc("eth_getCode", [w, "latest"]);
              let g;
              if (code === null) g = "No se pudo comprobar";
              else if (code === "0x") g = "Wallet normal (sin cuenta inteligente)";
              else if (/^0xef0100/i.test(code)) { const d = "0x" + code.slice(8, 48).toLowerCase(); g = "Cuenta inteligente " + (DELEG[d] || await etiqueta(d)); }
              else g = "Contrato: " + await etiqueta(w);
              (grupos[g] = grupos[g] || []).push({ w, b });
            }
            const total = conSaldo.reduce((a, [, b]) => a + b, 0);
            console.log("HOLDERS de SECT con saldo en la wallet:", conSaldo.length, "· total", total.toFixed(2), "SECT");
            Object.entries(grupos).sort((a, b) => b[1].reduce((s, x) => s + x.b, 0) - a[1].reduce((s, x) => s + x.b, 0)).forEach(([g, l]) => {
              const suma = l.reduce((s, x) => s + x.b, 0);
              const ver = /Uniswap|MetaMask|OKX|Alchemy|Contrato/.test(g) || l.length <= 15;
              console.log("GRUPO", g + ":", l.length, "wallets ·", suma.toFixed(2), "SECT", ver ? "→ " + l.sort((a, b) => b.b - a.b).map(x => corta(x.w) + " " + x.b.toFixed(2) + (esStaker.has(x.w) ? " (+staking)" : "")).join(", ") : "");
            });
          })().catch(e => { console.log("ERROR", e && e.message); });
          JS
          node run.cjs
