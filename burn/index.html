#globe{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 62% 40% at 50% 54%,rgba(0,0,0,.62),rgba(0,0,0,.28) 64%,rgba(0,0,0,.1) 100%)}

.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.04em;font-size:14px}

.top-r{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--ink-2)}

.lang button.on{background:#fff;color:#000}
.utc{display:none}

.live{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid rgba(91,155,255,.4);border-radius:999px;background:rgba(21,105,255,.12);font-size:10px;color:#cfe0ff}

h1,.sub,.meta{text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.6)}
h1{margin-top:16px;font-size:clamp(34px,5.6vw,72px);font-weight:600;letter-spacing:-.035em;line-height:1.02}

.sub{margin-top:10px;font-size:clamp(14px,1.5vw,17px);font-weight:300;color:var(--ink-2)}

/* reloj de recuadros */
.clock{margin:clamp(26px,4.5vh,44px) auto 0;display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,1.4vw,16px)}
.tile{position:relative;width:min(clamp(74px,19.5vw,176px),22vh);aspect-ratio:1;border-radius:clamp(10px,1.4vw,18px);background:linear-gradient(180deg,rgba(18,26,46,.82),rgba(4,7,14,.9));border:1px solid rgba(150,190,255,.22);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}

.tile.d .unit{color:rgba(255,255,255,.85)}
.bar{position:absolute;left:clamp(8px,1.2vw,14px);right:clamp(8px,1.2vw,14px);top:clamp(8px,1.1vw,13px);height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;z-index:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue-2);border-radius:2px;transition:width .4s linear}
.tile.d .bar i{background:#fff}
.colon{align-self:center;display:flex;flex-direction:column;gap:clamp(8px,1.3vw,16px)}
.colon i{width:clamp(4px,.55vw,7px);aspect-ratio:1;border-radius:50%;background:var(--blue)}

.flip{animation:fl .5s cubic-bezier(.2,.8,.2,1)}

.strip{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.ex{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.note{margin-top:16px;font-size:14px;font-weight:300;color:var(--ink-2);max-width:640px}
.end{text-align:center}
.end h2{font-size:clamp(30px,4.6vw,56px);font-weight:300;letter-spacing:-.03em;line-height:1.05}

footer{background:#000;border-top:1px solid var(--line);padding:24px 0 calc(24px + env(safe-area-inset-bottom));font-size:10px;color:var(--ink-3)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
