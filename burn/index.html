:root{--blue:#1569ff;--blue-2:#5b9bff;--ink:#fff;--ink-2:rgba(255,255,255,.66);--ink-3:rgba(255,255,255,.4);--line:rgba(255,255,255,.12);--pad:clamp(16px,4vw,56px)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#000}
body{background:#000;color:var(--ink);font-family:Plex,system-ui,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 58% 44% at 50% 50%,rgba(0,0,0,.8),rgba(0,0,0,.45) 62%,rgba(0,0,0,.18) 100%)}

.brand svg{width:24px;height:24px}
.top-r{display:flex;align-items:center;gap:18px;font-size:11px;color:var(--ink-2)}

.lang button{background:none;border:0;color:var(--ink-3);font:500 11px PlexMono,monospace;letter-spacing:.16em;padding:6px 6px;cursor:pointer}

.hud{position:absolute;font-size:10px;color:var(--ink-3);letter-spacing:.2em}
.hud.bl{left:var(--pad);bottom:28px}.hud.br{right:var(--pad);bottom:28px}
.corner{position:absolute;width:22px;height:22px;border-color:rgba(255,255,255,.35);border-style:solid}
.c1{left:var(--pad);top:76px;border-width:1px 0 0 1px}.c2{right:var(--pad);top:76px;border-width:1px 1px 0 0}
.c3{left:var(--pad);bottom:56px;border-width:0 0 1px 1px}.c4{right:var(--pad);bottom:56px;border-width:0 1px 1px 0}
.kick{font-size:11px;color:var(--blue-2)}
.kick b{color:#fff;font-weight:500}
.clock{margin-top:26px;display:flex;align-items:flex-start;justify-content:center;gap:clamp(4px,1.2vw,14px)}
.grp{display:flex;flex-direction:column;align-items:center}
.num{font-size:clamp(46px,11.5vw,156px);font-weight:200;letter-spacing:-.03em;line-height:.95;font-variant-numeric:tabular-nums}
.sep{font-size:clamp(46px,11.5vw,156px);font-weight:200;line-height:.95;color:var(--blue)}
.lbl{margin-top:12px;font-size:10px;color:var(--ink-3)}
.supply{margin-top:30px;font-size:clamp(12px,1.3vw,14px);color:var(--ink-2)}

.legend{margin-top:10px;display:flex;justify-content:center;gap:18px;font-size:10px;color:var(--ink-3)}
.legend em{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:-1px;background:#fff;border-radius:1px}
.legend em.q{background:transparent;box-shadow:inset 0 0 0 1px rgba(91,155,255,.8)}
.date{margin-top:22px;font-size:11px;color:var(--ink-2);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.date b{color:#fff;font-weight:500}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 20px;border:1px solid rgba(255,255,255,.28);border-radius:4px;font:500 12px PlexMono,monospace;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.35);transition:background .2s,border-color .2s}

.done{display:none;margin-top:22px;font-size:12px;color:#fff}
body.hecho .done{display:block}

.lab{font-size:11px;color:var(--blue-2);display:flex;align-items:center;gap:12px}

.strip{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

      contract: '$SECT · ERC-20', copy: 'Copiar', copied: 'Copiado',
      k3: 'Listados confirmados tras la quema', conf: 'Confirmado',

      h4: 'Posiciónate: <b>HOLD.</b>', fine: 'Las cifras son ilustrativas.' }
  };
  var lang = 'en';
  try { var g = localStorage.getItem('sectora:burn-lang'); if (g === 'en' || g === 'es') lang = g; else if (/^es\b/i.test(navigator.language || '')) lang = 'es'; }
  catch (e) { if (/^es\b/i.test(navigator.language || '')) lang = 'es'; }

  document.querySelectorAll('.lang button').forEach(function(b){

  pinta();
  var segs = document.getElementById('segs'); for (var i = 0; i < 50; i++) { var s = document.createElement('span'); if (i >= 25) s.className = 'q'; segs.appendChild(s); }

  /* cuenta atras */
  var el = { d: document.getElementById('cd-d'), h: document.getElementById('cd-h'), m: document.getElementById('cd-m'), s: document.getElementById('cd-s') }, utc = document.getElementById('utc');
  var dos = function(n){ return String(n).padStart(2, '0'); };
  function tic(){
    var now = Date.now(), r = Math.max(0, Math.floor((META - now) / 1000));
    var dd = Math.floor(r / 86400); r -= dd * 86400; var hh = Math.floor(r / 3600); r -= hh * 3600; var mm = Math.floor(r / 60); r -= mm * 60;

    var u = new Date(now); utc.textContent = dos(u.getUTCHours()) + ':' + dos(u.getUTCMinutes()) + ':' + dos(u.getUTCSeconds());

  }
  tic(); setInterval(function(){ if (!document.hidden) tic(); }, 1000);

  var bt = document.getElementById('copy');
  bt.addEventListener('click', function(){
    var ca = document.getElementById('ca').textContent, ok = function(){ bt.textContent = TX[lang].copied; setTimeout(function(){ bt.textContent = TX[lang].copy; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ca).then(ok, function(){});
  });

  /* ---------- globo: tierra en puntos (mismos poligonos que el dashboard) y Hash Nodes reales ---------- */
  var cv = document.getElementById('globe'), cx = cv.getContext('2d'), hud = document.getElementById('hudl');
  var D = Math.PI / 180, W = 0, H = 0, DPR = 1, LAND = [], NODES = [], ARCS = [];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function v3(la, lo){ return [Math.cos(la * D) * Math.sin(lo * D), Math.sin(la * D), Math.cos(la * D) * Math.cos(lo * D)]; }
  function dentro(pols, lo, la){ var n = 0; for (var p = 0; p < pols.length; p++) { var pol = pols[p], c = false;
    for (var i = 0, j = pol.length - 1; i < pol.length; j = i++) { var xi = pol[i][0], yi = pol[i][1], xj = pol[j][0], yj = pol[j][1]; if ((yi > la) !== (yj > la) && lo < (xj - xi) * (la - yi) / (yj - yi) + xi) c = !c; }
    if (c) n++; } return n % 2 === 1; }
  function tierra(){ var pols = (window.SECTORA_GLOBE_LAND && window.SECTORA_GLOBE_LAND.land) || [], st = innerWidth < 700 ? 1.7 : 1.15;
    for (var la = -56; la <= 78; la += st) { var s2 = st / Math.max(.2, Math.cos(la * D)); for (var lo = -180; lo < 180; lo += s2) if (dentro(pols, lo, la)) LAND.push(v3(la, lo)); } }
  tierra();
  fetch('/nodos/activaciones.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
    var seen = {}; Object.keys(j.nodos || {}).forEach(function(k){ var n = j.nodos[k]; if (typeof n.la !== 'number' || typeof n.lo !== 'number') return;
      var key = n.la.toFixed(0) + ',' + n.lo.toFixed(0); if (seen[key]) return; seen[key] = 1; NODES.push({ v: v3(n.la, n.lo), ph: Math.random() * 6.28 }); });
    for (var i = 0; i < Math.min(14, NODES.length * 2); i++) { var a = NODES[(Math.random() * NODES.length) | 0], b = NODES[(Math.random() * NODES.length) | 0]; if (a !== b) ARCS.push([a, b, Math.random() * 12]); }
  }).catch(function(){});
  function size(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  size(); addEventListener('resize', size);
  var SOL = (function(v){ var l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })([-.5, .45, .75]);
  function rot(v, lon, tilt){ var cy = Math.cos(-lon * D), sy = Math.sin(-lon * D), x = v[0] * cy + v[2] * sy, z = -v[0] * sy + v[2] * cy, y = v[1], ct = Math.cos(tilt * D), st = Math.sin(tilt * D); return [x, y * ct - z * st, y * st + z * ct]; }
  function slerp(a, b, s){ var d = Math.acos(Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]))); if (d < 1e-4) return a; var k1 = Math.sin((1 - s) * d) / Math.sin(d), k2 = Math.sin(s * d) / Math.sin(d); return [a[0] * k1 + b[0] * k2, a[1] * k1 + b[1] * k2, a[2] * k1 + b[2] * k2]; }
  function draw(ms){
    var t = ms / 1000, mob = W < 700, R = mob ? Math.min(W * .62, H * .36) : Math.min(W * .34, H * .46), gx = W / 2, gy = H * (mob ? .5 : .52);
    var lon = -60 + t * 5, tilt = 18;
    cx.clearRect(0, 0, W, H);
    var g = cx.createRadialGradient(gx, gy, R * .96, gx, gy, R * 1.3); g.addColorStop(0, 'rgba(70,140,255,.32)'); g.addColorStop(.35, 'rgba(21,105,255,.08)'); g.addColorStop(1, 'rgba(21,105,255,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(gx, gy, R * 1.32, 0, 6.29); cx.fill();
    g = cx.createRadialGradient(gx - R * .25, gy - R * .25, R * .05, gx, gy, R); g.addColorStop(0, '#0d1a36'); g.addColorStop(.7, '#050a18'); g.addColorStop(1, '#02040b');
    cx.fillStyle = g; cx.beginPath(); cx.arc(gx, gy, R, 0, 6.29); cx.fill();
    /* orbita */
    cx.save(); cx.translate(gx, gy); cx.rotate(-.32); cx.strokeStyle = 'rgba(150,195,255,.18)'; cx.lineWidth = 1; cx.beginPath(); cx.ellipse(0, 0, R * 1.42, R * .36, 0, 0, 6.29); cx.stroke();
    var sa = t * .35; cx.fillStyle = 'rgba(220,235,255,.9)'; cx.beginPath(); cx.arc(Math.cos(sa) * R * 1.42, Math.sin(sa) * R * .36, 2.2, 0, 6.29); cx.fill(); cx.restore();
    /* tierra */
    var ds = Math.max(1.3, R / 260), buckets = [[], [], [], [], [], []];
    for (var i = 0; i < LAND.length; i++) { var r = rot(LAND[i], lon, tilt); if (r[2] <= .02) continue;
      var luz = Math.max(0, Math.min(1, (r[0] * SOL[0] + r[1] * SOL[1] + r[2] * SOL[2]) * 1.5 + .2)), a = (.18 + .8 * luz) * Math.min(1, r[2] * 4);
      buckets[Math.min(5, (a * 6) | 0)].push(gx + r[0] * R, gy - r[1] * R); }
    for (var b = 0; b < 6; b++) { var c = buckets[b]; if (!c.length) continue; cx.fillStyle = 'rgba(' + (200 + b * 9) + ',' + (220 + b * 6) + ',255,' + ((b + .6) / 6).toFixed(2) + ')'; cx.beginPath();
      for (var k = 0; k < c.length; k += 2) cx.rect(c[k] - ds / 2, c[k + 1] - ds / 2, ds, ds); cx.fill(); }
    cx.strokeStyle = 'rgba(150,195,255,.35)'; cx.lineWidth = 1; cx.beginPath(); cx.arc(gx, gy, R, 0, 6.29); cx.stroke();
    /* arcos entre nodos */
    cx.globalCompositeOperation = 'lighter'; cx.lineCap = 'round';
    for (var q = 0; q < ARCS.length; q++) { var A = ARCS[q], e = ((t + A[2]) % 12) / 12; if (e > .45) continue; var pr = Math.min(1, e / .25), fade = 1 - Math.max(0, (e - .3) / .15);
      var dist = Math.acos(Math.max(-1, Math.min(1, A[0].v[0] * A[1].v[0] + A[0].v[1] * A[1].v[1] + A[0].v[2] * A[1].v[2]))), hgt = .08 + dist * .14;
      cx.strokeStyle = 'rgba(110,175,255,' + (.65 * fade).toFixed(3) + ')'; cx.lineWidth = 1.4; cx.beginPath(); var pen = false;
      for (var s = 0; s <= 40 * pr; s++) { var v = slerp(A[0].v, A[1].v, s / 40), kk = 1 + hgt * Math.sin(Math.PI * s / 40), rr = rot([v[0] * kk, v[1] * kk, v[2] * kk], lon, tilt);
        if (rr[2] < -.05) { pen = false; continue; } var px = gx + rr[0] * R, py = gy - rr[1] * R; pen ? cx.lineTo(px, py) : cx.moveTo(px, py); pen = true; } cx.stroke(); }
    /* nodos */
    for (var n = 0; n < NODES.length; n++) { var N = NODES[n], p = rot(N.v, lon, tilt); if (p[2] < .05) continue; var x = gx + p[0] * R, y = gy - p[1] * R, vis = Math.min(1, p[2] * 4), pu = .5 + .5 * Math.sin(t * 2 + N.ph);
      var gl = cx.createRadialGradient(x, y, 0, x, y, 12 + 6 * pu); gl.addColorStop(0, 'rgba(160,215,255,' + (.75 * vis).toFixed(3) + ')'); gl.addColorStop(1, 'rgba(21,105,255,0)');
      cx.fillStyle = gl; cx.beginPath(); cx.arc(x, y, 12 + 6 * pu, 0, 6.29); cx.fill(); cx.fillStyle = 'rgba(255,255,255,' + vis.toFixed(3) + ')'; cx.beginPath(); cx.arc(x, y, 1.8, 0, 6.29); cx.fill(); }
    cx.globalCompositeOperation = 'source-over';
    var L = ((lon % 360) + 540) % 360 - 180; hud.textContent = 'LON ' + (L < 0 ? '−' : '+') + Math.abs(L).toFixed(1).padStart(5, '0') + '° · TILT ' + tilt + '°';
  }
  var last = 0;
  function loop(ms){ if (!document.hidden && ms - last > 31) { last = ms; draw(ms); } requestAnimationFrame(loop); }
  if (reduce) { draw(0); addEventListener('resize', function(){ draw(0); }); } else requestAnimationFrame(loop);
})();
