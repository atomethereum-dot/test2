<style>
@font-face{font-family:Plex;src:url('/fonts/IBMPlexSans.woff2') format('woff2');font-weight:100 700;font-display:swap}
@font-face{font-family:PlexMono;src:url('/fonts/IBMPlexMono-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:PlexMono;src:url('/fonts/IBMPlexMono-500.woff2') format('woff2');font-weight:500;font-display:swap}
:root{--blue:#1569ff;--blue-2:#5b9bff;--ink:#fff;--ink-2:rgba(255,255,255,.72);--ink-3:rgba(255,255,255,.5);--line:rgba(255,255,255,.14);--card:#0a0c11;--pad:clamp(16px,4vw,64px)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:#000;color:var(--ink);font-family:Plex,system-ui,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.m{font-family:PlexMono,ui-monospace,monospace;text-transform:uppercase;letter-spacing:.2em}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--blue-2)}
.eyebrow i{display:block;width:36px;height:2px;background:var(--blue)}

/* cabecera */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.02em}
.brand svg{width:30px;height:30px;flex:none}
.brand span{font-size:11px;color:var(--ink-3);display:none}
@media(min-width:720px){.brand span{display:inline}}
.top-r{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ink-3);font:500 11px PlexMono,monospace;letter-spacing:.16em;padding:8px 12px;cursor:pointer}
.lang button.on{background:#fff;color:#000}
.home{font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap}
.home:hover{border-color:#fff;color:#fff}

/* portada con la cuenta atras */
.hero{position:relative;overflow:hidden;padding:clamp(48px,9vh,110px) 0 clamp(56px,9vh,104px)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:96px 96px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 25%,transparent 90%);mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 25%,transparent 90%);animation:drift 40s linear infinite}
.hero:after{content:"";position:absolute;left:50%;top:38%;width:min(1100px,140vw);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(21,105,255,.28),rgba(21,105,255,.06) 40%,transparent 66%);pointer-events:none}
@keyframes drift{to{background-position:96px 96px}}
@media(prefers-reduced-motion:reduce){.hero:before{animation:none}}
.hero .wrap{position:relative;z-index:1;text-align:center}
.hero .eyebrow{justify-content:center}
h1{margin-top:22px;font-size:clamp(38px,7.2vw,96px);font-weight:600;letter-spacing:-.035em;line-height:1.02}
h1 .lt{font-weight:250}
h1 b{color:var(--blue-2);font-weight:600}
.lede{max-width:720px;margin:20px auto 0;font-size:clamp(16px,1.6vw,20px);font-weight:300;color:var(--ink-2)}

.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.4vw,18px);max-width:980px;margin:clamp(34px,6vh,58px) auto 0}
.cell{position:relative;background:linear-gradient(180deg,#0b0f19,#05070c);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2.4vw,30px) 6px clamp(12px,2vw,22px);overflow:hidden}
.cell:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.06)}
.cell.d{background:linear-gradient(180deg,#1a74ff,#0f56d9);border-color:#1569ff}
.cell.d:before{background:rgba(255,255,255,.14)}
.num{display:block;font-size:clamp(40px,9vw,124px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.unit{display:block;margin-top:10px;font-size:clamp(9px,1vw,12px);color:var(--ink-2)}
.cell.d .unit{color:rgba(255,255,255,.9)}
.tick{animation:tk .45s cubic-bezier(.2,.7,.2,1)}
@keyframes tk{from{transform:translateY(-14%);opacity:.35}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.tick{animation:none}}
.when{margin-top:22px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;font-size:12px;color:var(--ink-2)}
.when b{color:#fff;font-weight:500}
.done{display:none;margin:34px auto 0;max-width:720px;padding:22px 26px;border:1px solid var(--blue);border-radius:14px;background:rgba(21,105,255,.12);font-size:18px}
body.hecho .done{display:block}

.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-weight:500;font-size:16px;border:1px solid var(--line);transition:transform .2s,background .2s,border-color .2s}
.btn.pri{background:var(--blue);border-color:var(--blue)}
.btn.pri:hover{background:#2a78ff}
.btn.alt:hover{border-color:#fff}
.btn small{font:500 11px PlexMono,monospace;letter-spacing:.14em;opacity:.8}

/* secciones */
section.blk{padding:clamp(56px,9vh,104px) 0;border-top:1px solid var(--line)}
h2{margin-top:16px;font-size:clamp(30px,4.6vw,58px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
h2 b{color:var(--blue-2);font-weight:600}
.sub{margin-top:14px;max-width:680px;color:var(--ink-2);font-weight:300;font-size:clamp(15px,1.4vw,18px)}

/* supply: barra antes / despues */
.meter{margin-top:38px;display:grid;gap:22px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.mlab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.mlab span{font-size:12px;color:var(--ink-2)}
.mlab b{font-size:clamp(28px,4.4vw,56px);font-weight:200;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bar{position:relative;height:18px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar.full i{width:100%;background:#fff}
.bar.half i{width:50%;background:var(--blue)}
.bar.half:after{content:"";position:absolute;left:50%;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 6px,transparent 6px 12px)}
.bar.half em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 10px PlexMono,monospace;letter-spacing:.18em;color:rgba(255,255,255,.8);font-style:normal}

/* ficha */
.facts{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.fact dt{font-size:11px;color:var(--ink-3)}
.fact dd{margin-top:10px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.fact dd small{display:block;margin-top:4px;font-size:13px;font-weight:300;color:var(--ink-2);letter-spacing:0}
.addr{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.addr code{font:400 clamp(11px,1.3vw,15px) PlexMono,monospace;word-break:break-all;flex:1;min-width:0;color:var(--ink-2)}
.addr button{background:#fff;color:#000;border:0;border-radius:999px;padding:9px 16px;font:500 11px PlexMono,monospace;letter-spacing:.14em;cursor:pointer;text-transform:uppercase}

/* listados */
.ex{margin-top:38px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:860px){.ex{grid-template-columns:repeat(2,minmax(0,1fr))}}
.xc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:22px}
.xc .lg{height:52px;display:flex;align-items:center;justify-content:center;gap:12px}
.xc .lg b{font-size:28px;font-weight:600;letter-spacing:-.02em}
.xc .lg svg{display:block;flex:none}
.xc .ok{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--ink-2)}
.xc .ok i{width:22px;height:22px;border-radius:4px;background:var(--blue);display:grid;place-items:center}
.xc .lg svg.wm{width:150px;height:auto;max-width:100%}
@media(max-width:600px){.eyebrow{font-size:11px;letter-spacing:.14em;gap:10px}.hero .eyebrow i{display:none}
  .addr .lb{flex-basis:100%}.addr code{flex-basis:100%}.xc .ok{letter-spacing:.12em}}
@media(max-width:480px){.xc{padding:20px 12px 16px}.xc .lg{gap:8px}.xc .lg b{font-size:21px}.xc .lg svg.ic{width:36px;height:36px}.xc .lg svg.wm{width:112px}}

/* pie */
.cta-end{text-align:center}
.cta-end .ctas{margin-top:28px}
footer{border-top:1px solid var(--line);padding:30px 0 calc(30px + env(safe-area-inset-bottom));font-size:12px;color:var(--ink-3)}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
footer p{max-width:760px}
footer .legal{font-size:11px}
</style>
<script src="/analytics.js" defer></script>
</head>
