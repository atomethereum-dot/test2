:root{--blue:#1569ff;--blue-2:#5b9bff;--ink:#fff;--ink-2:rgba(255,255,255,.68);--ink-3:rgba(255,255,255,.42);--line:rgba(255,255,255,.12);--pad:clamp(16px,4vw,56px)}
*{margin:0;padding:0;box-sizing:border-box}

body{background:#000;color:var(--ink);font-family:Plex,system-ui,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.m{font-family:PlexMono,ui-monospace,monospace;text-transform:uppercase;letter-spacing:.18em}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

#globe{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,0) 34%,rgba(0,0,0,.5) 62%,rgba(0,0,0,.72))}

.brand svg{width:26px;height:26px}

h1,.sub,.meta{text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.6)}

h1 .ar{font-size:.42em;color:rgba(255,255,255,.45);font-weight:300}

.sub{margin-top:10px;font-size:clamp(14px,1.5vw,17px);font-weight:300;color:var(--ink-2)}

/* reloj de recuadros */

.tile{position:relative;width:min(clamp(64px,19.5vw,176px),22vh);aspect-ratio:1;border-radius:clamp(10px,1.4vw,18px);background:linear-gradient(180deg,rgba(18,26,46,.82),rgba(4,7,14,.9));border:1px solid rgba(150,190,255,.22);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.65);box-shadow:0 1px 0 rgba(255,255,255,.06);z-index:2}

.tile{background:rgba(2,6,14,.48)!important;border-color:rgba(150,190,255,.3)!important;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 30px 80px rgba(0,0,0,.55)!important}

.dig{position:relative;z-index:1;font-size:min(clamp(34px,9vw,94px),11.5vh);font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;display:block}

.tile.d .unit{color:rgba(255,255,255,.85)}
.bar{position:absolute;left:clamp(8px,1.2vw,14px);right:clamp(8px,1.2vw,14px);top:clamp(8px,1.1vw,13px);height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;z-index:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue-2);border-radius:2px;transition:width .4s linear}

.colon{align-self:center;display:flex;flex-direction:column;gap:clamp(8px,1.3vw,16px)}
.colon i{width:clamp(4px,.55vw,7px);aspect-ratio:1;border-radius:50%;background:var(--blue)}

.hud{position:absolute;bottom:22px;font-size:9px;color:var(--ink-3);letter-spacing:.2em}
.hud.bl{left:var(--pad)}.hud.br{right:var(--pad)}

/* secciones */
.blk{background:rgba(0,0,0,.88);border-top:1px solid var(--line);padding:clamp(52px,8vh,88px) 0}
.lab{font-size:11px;color:var(--blue-2);display:flex;align-items:center;gap:12px}
.lab:before{content:"";width:28px;height:1px;background:var(--blue)}
.strip{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.strip div:last-child{border-right:0}

.ex{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.xc{background:#000;padding:26px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:18px}

.note{margin-top:16px;font-size:14px;font-weight:300;color:var(--ink-2);max-width:640px}
.end{text-align:center}
.end h2{font-size:clamp(30px,4.6vw,56px);font-weight:300;letter-spacing:-.03em;line-height:1.05}
.end h2 b{font-weight:600;color:var(--blue-2)}
footer{background:#000;border-top:1px solid var(--line);padding:24px 0 calc(24px + env(safe-area-inset-bottom));font-size:10px;color:var(--ink-3)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media(min-width:2400px) and (min-height:1300px){.top,.hero>div,.hud,.blk .wrap,footer .wrap{zoom:1.5}}
@media(min-width:3200px) and (min-height:1800px){.top,.hero>div,.hud,.blk .wrap,footer .wrap{zoom:2}}
</style>
